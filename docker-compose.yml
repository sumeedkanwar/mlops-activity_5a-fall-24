version: "3.8"
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app_net
    environment:
      # Ensure file watching works inside Docker on Windows/Mac
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      # Helpful when accessing via localhost
      WDS_SOCKET_PORT: 3000
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - build/
            - .git/
        - action: rebuild
          path: ./frontend/package.json

  backend:
    build: ./backend
    ports:
      - "5001:5000"
    depends_on:
      - db
    networks:
      - app_net
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: samiullah6799
      POSTGRES_DB: mydb
      FLASK_DEBUG: "1"
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - __pycache__/
            - venv/
            - .venv/
            - '*.pyc'
        - action: rebuild
          path: ./backend/requirements.txt

  db:
    image: postgres:13
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: samiullah6799
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    networks:
      - app_net

volumes:
  db_data: {}

networks:
  app_net:
    driver: bridge
